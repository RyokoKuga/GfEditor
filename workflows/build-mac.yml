name: Build Mac App (Universal)
on:
  push:
    branches: [ "main" ] # mainブランチにpushされたら自動実行
  workflow_dispatch:      # 手動で実行ボタンを押すことも可能

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm' # キャッシュを使って2回目以降を高速化

      - name: Install dependencies
        run: npm install

      - name: Build Mac App (Universal)
        # --universalフラグでIntel/Appleシリコン両対応
        run: npx electron-builder --mac --universal
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifacts@v4
        with:
          name: Mac-App-Universal
          path: dist/*.dmg # ビルドされたファイルをGitHub上に保存
