<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0;URL='./items/calculation/main.html'">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GfEditor Loading...</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #fdfaf0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Montserrat', sans-serif;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(100, 149, 237, 0.2);
            border-top: 5px solid #6495ED;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading-text {
            color: #6495ED;
            font-weight: 700;
            letter-spacing: 0.1em;
            font-size: 1.2rem;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="spinner"></div>
    <div class="loading-text">Loading GfEditor...</div>
</body>
</html>
